<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body>

    <!-- 🔹 NAVBAR -->
    <header class="navbar">
        <h1>🏠 Inmobiliaria</h1>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Propiedades</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <!-- 🔹 HERO / BIENVENIDA -->
    <section class="hero">
        <h2>Encuentra tu hogar ideal</h2>
        <p>Compra, vende o arrienda propiedades fácilmente</p>
        <button>Ver propiedades</button>
    </section>

    <!-- 🔹 BUSCADOR -->
    <section class="buscador">
        <h3>Buscar propiedades</h3>
        <form>
            <input type="text" placeholder="Ciudad">
            <select>
                <option>Tipo</option>
                <option>Casa</option>
                <option>Apartamento</option>
            </select>
            <button type="submit">Buscar</button>
        </form>
    </section>

    <!-- 🔹 LISTADO DE PROPIEDADES -->
    <section class="propiedades">
        <h3>Propiedades disponibles</h3>

        <div class="card">
            <h4>Casa en Neiva</h4>
            <p>$200.000.000</p>
            <button>Ver más</button>
        </div>

        <div class="card">
            <h4>Apartamento en Bogotá</h4>
            <p>$350.000.000</p>
            <button>Ver más</button>
        </div>

    </section>

    <!-- 🔹 FOOTER -->
    <footer>
        <p>© 2026 Inmobiliaria App</p>
    </footer>

    <!-- JS -->
    <script src="../src/main.js"></script>
</body>
</html>
